<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- Background: rounded square -->
  <rect width="512" height="512" rx="112" fill="#1a1a1e" />

  <!-- T-shirt silhouette, mirrored about x=256 -->
  <path fill="#5bb8ff"
        d="M 256 456 L 380 456 L 380 183 L 433 205 L 467 100 L 390 56
           L 312 56 Q 256 170 200 56
           L 122 56 L 45 100 L 79 205 L 132 183 L 132 456 Z" />

  <!-- Collar stitch -->
