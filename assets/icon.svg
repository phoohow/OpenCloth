        d="M 195 82 Q 256 176 317 82" />

  <!-- Centre seam -->
  <path fill="none" stroke="#ffffff" stroke-opacity="0.45"
        stroke-width="9" stroke-dasharray="16 15" stroke-linecap="round"
        d="M 256 146 L 256 440" />

  <!-- Hem stitch -->
  <path fill="none" stroke="#ffffff" stroke-opacity="0.45"
